<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #fff; color: #0a0a0a; font-family: 'Inter', sans-serif; overflow: hidden; }
  .wrap { position: relative; width: 100%; height: 100%; }
  .top { position: absolute; top: 0; left: 0; right: 0; padding: 30px 26px; display: flex; flex-direction: column; gap: 10px; z-index: 3; }
  .mark { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 3px; color: #8a8a8a; }
  .title { font-weight: 800; font-size: clamp(1.4rem, 6vw, 2.4rem); line-height: 1; letter-spacing: -1.5px; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 3; }
  .num { font-weight: 900; font-size: clamp(12rem, 45vw, 24rem); line-height: 0.85; letter-spacing: -12px; transition: transform 0.35s ease; }
  .num.pop { transform: scale(1.12); }
  .sub { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; letter-spacing: 4px; color: #8a8a8a; text-transform: uppercase; margin-top: 20px; }
  .red { position: absolute; bottom: 0; left: 0; right: 0; height: 32%; background: #e94b2c; z-index: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="mark">/ COUNT</span>
    <h2 class="title">BIRTHDAY<br>COUNTDOWN</h2>
  </div>
  <div class="center">
    <div class="num" id="num">5</div>
    <p class="sub" id="sub">PREPARING</p>
  </div>
  <div class="red"></div>
</div>

<audio id="applause" src="assets/applause.mp3" loop preload="auto"></audio>

<script>
  // Start applause looping immediately
  var applause = document.getElementById('applause');
  applause.volume = 0.7;
  var playPromise = applause.play();
  if (playPromise) playPromise.catch(function() {
    document.body.addEventListener('click', function() {
      applause.play().catch(function(){});
    }, { once: true });
  });

  // Save state so home.html knows applause should be running
  sessionStorage.setItem('applause_running', '1');

  var num = document.getElementById('num');
  var seq = [5, 4, 3, 2, 1];
  var i = 0;
  var step = setInterval(function() {
    if (i >= seq.length) {
      clearInterval(step);
      window.location.href = 'home.html';
      return;
    }
    num.textContent = seq[i];
    num.classList.add('pop');
    setTimeout(function() { num.classList.remove('pop'); }, 150);
    i++;
  }, 1000);
</script>
</body>
</html>
