<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
  .wrap { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  .loader { width: 60px; height: 60px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.9) 0deg 10deg, transparent 10deg 30deg); -webkit-mask: radial-gradient(circle, transparent 42%, #000 43%); mask: radial-gradient(circle, transparent 42%, #000 43%); animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lbl { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; letter-spacing: 6px; text-transform: uppercase; }
  .count { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; letter-spacing: 3px; color: rgba(255,255,255,0.55); margin-top: -6px; }
  .msg { font-weight: 300; font-size: 1.15rem; letter-spacing: 2px; margin-top: 10px; min-height: 1.6em; transition: opacity 0.4s, transform 0.4s; }
  .msg.swap { opacity: 0; transform: translateY(6px); }
</style>
</head>
<body>
<div class="wrap">
  <div class="loader"></div>
  <p class="lbl">LOADING</p>
  <p class="count" id="count">1</p>
  <p class="msg" id="msg">A special day</p>
</div>
<script>
  var msgs = [
    { at: 1,  text: 'A special day' },
    { at: 34, text: 'Another moment' },
    { at: 67, text: 'A blessed one' }
  ];
  var countEl = document.getElementById('count');
  var msgEl = document.getElementById('msg');
  var start = performance.now();
  var total = 3000;
  function tick(now) {
    var elapsed = now - start;
    var pct = Math.min(100, Math.floor((elapsed / total) * 100));
    countEl.textContent = Math.max(1, pct);
    var target = msgs[0];
    for (var i = 0; i < msgs.length; i++) if (pct >= msgs[i].at) target = msgs[i];
    if (msgEl.textContent !== target.text) {
      msgEl.classList.add('swap');
      (function(t) {
        setTimeout(function() { msgEl.textContent = t; msgEl.classList.remove('swap'); }, 200);
      })(target.text);
    }
    if (elapsed < total) requestAnimationFrame(tick);
    else {
      countEl.textContent = '100';
      setTimeout(function() { window.location.href = 'countdown.html'; }, 700);
    }
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
